<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Component Lifecycle — Mount → Update → Unmount</text>

  <!-- Mounting -->
  <rect x="30" y="60" width="260" height="150" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2.5"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">1. Mounting</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#276749">(component is created &amp; inserted)</text>
  <text x="45" y="132" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">constructor()</text>
  <text x="45" y="152" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">render()</text>
  <text x="45" y="172" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">componentDidMount()</text>
  <text x="45" y="195" font-size="10.5" fill="#4a5568">e.g. fetch initial data,</text>

  <line x1="290" y1="135" x2="330" y2="135" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow10)"/>

  <!-- Updating -->
  <rect x="340" y="60" width="260" height="150" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <text x="470" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">2. Updating</text>
  <text x="470" y="108" text-anchor="middle" font-size="11" fill="#2c5282">(props or state change)</text>
  <text x="355" y="132" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">render()</text>
  <text x="355" y="152" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">componentDidUpdate()</text>
  <text x="355" y="175" font-size="10.5" fill="#4a5568">e.g. respond to a prop</text>
  <text x="355" y="193" font-size="10.5" fill="#4a5568">changing, sync with API</text>

  <line x1="600" y1="135" x2="640" y2="135" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow10)"/>

  <!-- Unmounting -->
  <rect x="650" y="60" width="220" height="150" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="760" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">3. Unmounting</text>
  <text x="760" y="108" text-anchor="middle" font-size="11" fill="#c53030">(removed from the DOM)</text>
  <text x="665" y="132" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">componentWillUnmount()</text>
  <text x="665" y="155" font-size="10.5" fill="#4a5568">e.g. clear timers,</text>
  <text x="665" y="173" font-size="10.5" fill="#4a5568">remove event listeners</text>

  <!-- loop back arrow for updating -->
  <path d="M 470 210 C 470 235, 470 235, 470 235" fill="none" stroke="none"/>
  <path d="M 550 210 C 620 240, 550 240, 470 213" fill="none" stroke="#3182ce" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow10)"/>
  <text x="600" y="235" text-anchor="middle" font-size="10.5" fill="#3182ce">repeats on every change</text>

  <!-- Hooks equivalent -->
  <rect x="30" y="270" width="840" height="160" rx="10" fill="#fefcbf" stroke="#d69e2e" stroke-width="2.5"/>
  <text x="450" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#744210">Functional Component Equivalent: useEffect</text>

  <text x="55" y="330" font-size="12.5" font-family="Consolas, monospace" fill="#2d3748">useEffect(() =&gt; {"{"}</text>
  <text x="75" y="350" font-size="12.5" font-family="Consolas, monospace" fill="#2d3748">// runs after mount AND after every update</text>
  <text x="75" y="370" font-size="12.5" font-family="Consolas, monospace" fill="#2d3748">fetchData();</text>
  <text x="75" y="390" font-size="12.5" font-family="Consolas, monospace" fill="#2d3748">return () =&gt; {"{"} /* cleanup = componentWillUnmount */ {"}"};</text>
  <text x="55" y="410" font-size="12.5" font-family="Consolas, monospace" fill="#2d3748">{"}"}, [dependency]); // empty array = componentDidMount only</text>
</svg>
