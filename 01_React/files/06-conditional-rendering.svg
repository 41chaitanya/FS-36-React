<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Conditional Rendering — Choosing What to Show</text>

  <!-- Diamond decision -->
  <polygon points="450,60 560,130 450,200 340,130" fill="#fefcbf" stroke="#d69e2e" stroke-width="2.5"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">isLoggedIn?</text>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#744210">(a plain JS condition)</text>

  <!-- true branch -->
  <line x1="470" y1="90" x2="720" y2="90" stroke="#38a169" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="600" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">true</text>
  <rect x="620" y="55" width="220" height="70" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2.5"/>
  <text x="730" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#276749">&lt;Dashboard /&gt;</text>
  <text x="730" y="100" text-anchor="middle" font-size="11" fill="#2d3748">ternary: cond ? A : B</text>

  <!-- false branch -->
  <line x1="470" y1="170" x2="720" y2="170" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="600" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#c53030">false</text>
  <rect x="620" y="150" width="220" height="70" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="730" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c53030">&lt;LoginForm /&gt;</text>
  <text x="730" y="195" font-size="11" fill="#2d3748" text-anchor="middle">shown instead</text>

  <!-- techniques box -->
  <rect x="60" y="260" width="780" height="140" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">Common Techniques</text>

  <text x="90" y="315" font-family="Consolas, monospace" font-size="12" fill="#2d3748">1. Ternary:</text>
  <text x="220" y="315" font-family="Consolas, monospace" font-size="12" fill="#2d3748">{"{"}isLoggedIn ? &lt;Dashboard/&gt; : &lt;LoginForm/&gt;{"}"}</text>

  <text x="90" y="342" font-family="Consolas, monospace" font-size="12" fill="#2d3748">2. &amp;&amp; short-circuit:</text>
  <text x="260" y="342" font-family="Consolas, monospace" font-size="12" fill="#2d3748">{"{"}unreadCount &gt; 0 &amp;&amp; &lt;Badge/&gt;{"}"}</text>

  <text x="90" y="369" font-family="Consolas, monospace" font-size="12" fill="#2d3748">3. Early return:</text>
  <text x="230" y="369" font-family="Consolas, monospace" font-size="12" fill="#2d3748">if (loading) return &lt;Spinner/&gt;;</text>

  <text x="90" y="392" font-family="Consolas, monospace" font-size="12" fill="#2d3748">4. Variable + if/else assigned before return</text>
</svg>
