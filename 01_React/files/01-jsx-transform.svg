<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">How JSX Becomes What You See on Screen</text>

  <!-- Step 1: JSX code -->
  <rect x="20" y="70" width="220" height="150" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">1. JSX (what you write)</text>
  <text x="35" y="125" font-size="12" fill="#2d3748" font-family="Consolas, monospace">const el = (</text>
  <text x="45" y="145" font-size="12" fill="#2d3748" font-family="Consolas, monospace">&lt;h1 class="a"&gt;</text>
  <text x="55" y="165" font-size="12" fill="#2d3748" font-family="Consolas, monospace">Hi, {name}</text>
  <text x="45" y="185" font-size="12" fill="#2d3748" font-family="Consolas, monospace">&lt;/h1&gt;</text>
  <text x="35" y="205" font-size="12" fill="#2d3748" font-family="Consolas, monospace">);</text>

  <line x1="240" y1="145" x2="300" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="270" y="135" text-anchor="middle" font-size="11" fill="#718096">Babel</text>

  <!-- Step 2: React.createElement -->
  <rect x="310" y="70" width="260" height="150" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="440" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#553c9a">2. JS Function Call</text>
  <text x="325" y="125" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">React.createElement(</text>
  <text x="335" y="145" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">"h1",</text>
  <text x="335" y="165" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">{"{"}className:"a"{"}"},</text>
  <text x="335" y="185" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">"Hi, ", name</text>
  <text x="325" y="205" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">)</text>

  <line x1="570" y1="145" x2="630" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="600" y="135" text-anchor="middle" font-size="11" fill="#718096">returns</text>

  <!-- Step 3: Element object -->
  <rect x="640" y="70" width="240" height="150" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">3. Plain JS Object</text>
  <text x="655" y="125" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">{"{"}</text>
  <text x="665" y="145" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">type: "h1",</text>
  <text x="665" y="165" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">props: {"{"}...{"}"},</text>
  <text x="665" y="185" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">children: [...]</text>
  <text x="655" y="205" font-size="11.5" fill="#2d3748" font-family="Consolas, monospace">{"}"}</text>

  <!-- Bottom arrow to DOM -->
  <line x1="760" y1="220" x2="760" y2="255" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow1)"/>
  <rect x="600" y="260" width="320" height="45" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="760" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#c53030">React renders this into real DOM nodes</text>

  <line x1="130" y1="220" x2="130" y2="245" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="245" text-anchor="middle" font-size="10.5" fill="#a0aec0">Never touches the DOM directly</text>
</svg>
