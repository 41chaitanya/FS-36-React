<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">Component Composition — Building Big UIs from Small Ones</text>

  <!-- App root -->
  <rect x="370" y="55" width="160" height="55" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="2.5"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">&lt;App /&gt;</text>

  <!-- connectors down -->
  <line x1="450" y1="110" x2="450" y2="135" stroke="#4a5568" stroke-width="2"/>
  <line x1="180" y1="135" x2="720" y2="135" stroke="#4a5568" stroke-width="2"/>
  <line x1="180" y1="135" x2="180" y2="155" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow8)"/>
  <line x1="450" y1="135" x2="450" y2="155" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow8)"/>
  <line x1="720" y1="135" x2="720" y2="155" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow8)"/>

  <!-- three children -->
  <rect x="90" y="160" width="180" height="55" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <text x="180" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">&lt;Header /&gt;</text>

  <rect x="360" y="160" width="180" height="55" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2.5"/>
  <text x="450" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#276749">&lt;MainContent /&gt;</text>

  <rect x="630" y="160" width="180" height="55" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2.5"/>
  <text x="720" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#553c9a">&lt;Footer /&gt;</text>

  <!-- MainContent children -->
  <line x1="450" y1="215" x2="450" y2="240" stroke="#4a5568" stroke-width="2"/>
  <line x1="330" y1="240" x2="570" y2="240" stroke="#4a5568" stroke-width="2"/>
  <line x1="330" y1="240" x2="330" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow8)"/>
  <line x1="570" y1="240" x2="570" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow8)"/>

  <rect x="240" y="265" width="180" height="50" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="330" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9c4221">&lt;Sidebar /&gt;</text>

  <rect x="480" y="265" width="180" height="50" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="570" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c53030">&lt;ArticleList /&gt;</text>

  <text x="450" y="355" text-anchor="middle" font-size="12.5" fill="#4a5568">Each box is small, focused, and reusable — App just assembles them, often passing children as props.</text>
</svg>
