<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">useContext — Skipping the Prop-Drilling Chain</text>

  <!-- Without context (prop drilling) -->
  <text x="215" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">❌ Without Context: Prop Drilling</text>
  <rect x="120" y="75" width="190" height="45" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="215" y="102" text-anchor="middle" font-size="12" fill="#c53030">&lt;App theme="dark"&gt;</text>
  <line x1="215" y1="120" x2="215" y2="140" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="120" y="145" width="190" height="45" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="215" y="172" text-anchor="middle" font-size="11.5" fill="#c53030">&lt;Layout theme={"{"}theme{"}"}&gt;</text>
  <line x1="215" y1="190" x2="215" y2="210" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="120" y="215" width="190" height="45" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="215" y="242" text-anchor="middle" font-size="11.5" fill="#c53030">&lt;Sidebar theme={"{"}theme{"}"}&gt;</text>
  <line x1="215" y1="260" x2="215" y2="280" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="120" y="285" width="190" height="45" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="2.5"/>
  <text x="215" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9b2c2c">&lt;ThemeToggle theme /&gt;</text>
  <text x="215" y="350" text-anchor="middle" font-size="11" fill="#c53030">Every middle layer must accept</text>
  <text x="215" y="366" text-anchor="middle" font-size="11" fill="#c53030">and forward a prop it never uses.</text>

  <!-- With context -->
  <text x="670" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">✅ With Context: Direct Access</text>
  <rect x="560" y="75" width="220" height="55" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2.5"/>
  <text x="670" y="98" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#276749">&lt;ThemeContext.Provider</text>
  <text x="670" y="116" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#276749">value={"{"}theme{"}"}&gt;</text>

  <line x1="670" y1="130" x2="670" y2="155" stroke="#38a169" stroke-width="2"/>
  <line x1="590" y1="155" x2="750" y2="155" stroke="#38a169" stroke-width="2"/>
  <line x1="590" y1="155" x2="590" y2="175" stroke="#38a169" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="750" y1="155" x2="750" y2="175" stroke="#38a169" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="500" y="180" width="150" height="45" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="575" y="207" text-anchor="middle" font-size="11" fill="#276749">&lt;Layout /&gt; (passthrough)</text>

  <rect x="690" y="180" width="150" height="45" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="765" y="207" text-anchor="middle" font-size="11" fill="#276749">&lt;Sidebar /&gt; (passthrough)</text>

  <line x1="765" y1="225" x2="765" y2="250" stroke="#38a169" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="670" y="255" width="220" height="55" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="2.5"/>
  <text x="780" y="278" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#22543d">const theme =</text>
  <text x="780" y="296" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#22543d">useContext(ThemeContext);</text>

  <text x="670" y="345" text-anchor="middle" font-size="11" fill="#276749">Middle components pass children through unchanged;</text>
  <text x="670" y="361" text-anchor="middle" font-size="11" fill="#276749">only the component that needs the value reads it directly.</text>
</svg>
