<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow13" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a202c">useRef — Two Common Jobs</text>

  <!-- DOM access -->
  <rect x="40" y="60" width="390" height="160" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.5"/>
  <text x="235" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">1. Direct DOM Access</text>
  <text x="55" y="115" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">const inputRef = useRef(null);</text>
  <text x="55" y="138" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">&lt;input ref={"{"}inputRef{"}"} /&gt;</text>
  <text x="55" y="161" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">inputRef.current.focus();</text>
  <text x="55" y="188" font-size="11.5" fill="#4a5568">Escape hatch for things React</text>
  <text x="55" y="204" font-size="11.5" fill="#4a5568">doesn't manage: focus, scroll, measure.</text>

  <!-- Mutable value -->
  <rect x="460" y="60" width="400" height="160" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2.5"/>
  <text x="660" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">2. Mutable Value (no re-render)</text>
  <text x="475" y="115" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">const renderCount = useRef(0);</text>
  <text x="475" y="138" font-size="11.5" font-family="Consolas, monospace" fill="#2d3748">renderCount.current += 1;</text>
  <text x="475" y="161" font-size="11.5" fill="#276749">Changing .current does NOT trigger</text>
  <text x="475" y="179" font-size="11.5" fill="#276749">a re-render — unlike useState.</text>
  <text x="475" y="200" font-size="11.5" fill="#4a5568">Good for timers IDs, previous values.</text>

  <!-- comparison table -->
  <rect x="40" y="240" width="820" height="120" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="450" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c4221">useRef vs useState</text>
  <line x1="450" y1="280" x2="450" y2="345" stroke="#feebc8" stroke-width="1.5"/>
  <text x="230" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c4221">useState</text>
  <text x="230" y="322" text-anchor="middle" font-size="11.5" fill="#2d3748">Updating it → re-renders the component</text>
  <text x="230" y="342" text-anchor="middle" font-size="11.5" fill="#2d3748">Value shown directly in the UI</text>

  <text x="670" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c4221">useRef</text>
  <text x="670" y="322" text-anchor="middle" font-size="11.5" fill="#2d3748">Updating .current → NO re-render</text>
  <text x="670" y="342" text-anchor="middle" font-size="11.5" fill="#2d3748">Value persists across renders silently</text>
</svg>
